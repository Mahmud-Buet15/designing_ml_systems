# TaxiETA local stack.  `make up`  (or: docker compose up -d --build)
#
#   Airflow 3 UI ....... http://localhost:8080   (no login in local dev mode)
#   Prediction API ..... http://localhost:8000/docs
#   MLflow UI .......... http://localhost:5001   (5001 because macOS uses 5000 for AirPlay)
#   Redpanda Console ... http://localhost:8081
#   Kafka (from host) .. localhost:19092         (from containers: redpanda:9092)
#
# TODO(M9): pin every image tag below once your stack works ("latest" is a reproducibility bug).

x-taxieta-env: &taxieta-env
  KAFKA_BOOTSTRAP: redpanda:9092
  MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-latest}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      retries: 10

  console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-latest}
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8081:8080"]
    depends_on: [redpanda]

  mlflow:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////app/data/mlflow/mlflow.db
      --artifacts-destination /app/data/mlflow/artifacts
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001
    ports: ["5001:5000"]
    volumes: ["./data:/app/data"]

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    environment: *taxieta-env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./src:/app/src"]
    depends_on: [redpanda]

  consumer:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: taxieta consume
    environment: *taxieta-env
    volumes: ["./data:/app/data", "./src:/app/src"]
    depends_on:
      redpanda: {condition: service_healthy}
    restart: on-failure

  airflow:
    build: {context: ., dockerfile: docker/Dockerfile.airflow}
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *taxieta-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/taxieta/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # local dev only!
      TAXIETA_API_URL: http://api:8000
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/taxieta/dags
      - ./src:/opt/taxieta/src
      - ./data:/opt/taxieta/data
      - ./reports:/opt/taxieta/reports
      - airflow-home:/opt/airflow
    depends_on: [redpanda, mlflow]

volumes:
  airflow-home:
