[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxieta"
version = "0.1.0"
description = "Hands-on project for Designing Machine Learning Systems: a production-style NYC taxi ETA system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "duckdb>=1.1",
  "numpy>=1.26",
  "pandera>=0.20",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "scipy>=1.13",
  "joblib>=1.4",
]

[project.optional-dependencies]
# Streaming (Milestones 2, 6-8)
stream = ["confluent-kafka>=2.4"]
# Experiment tracking + model registry (Milestones 5, 8, 9)
tracking = ["mlflow>=2.14"]
# Serving (Milestone 6)
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "httpx>=0.27"]
# Weak supervision (Milestone 3) -- install when you get there
weak = ["snorkel>=0.10"]
# Monitoring extras (Milestone 7) -- optional, the core KS/PSI checks need only scipy
monitor = ["evidently>=0.4"]
# Feature store (Milestone 9)
featurestore = ["feast>=0.40"]
dev = ["pytest>=8", "ruff>=0.5"]
all = ["taxieta[stream,tracking,serve,dev]"]

[project.scripts]
taxieta = "taxieta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taxieta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
